name: Build Android APK

# 触发条件（两个角色，各管一件事）：
#   1) push master     → 只做编译校验：assembleDebug，不发布、不改版本号、不回写、不上传 APK
#   2) push tag vX.Y.Z → 发布：用 tag 改版本号 → assembleRelease → 发 Release → 回写 master
# 注意：裸号 tag（如 2.4.7）与 release-* 之类的 tag 不触发任何构建。
#
# 去重：一次 push 同时更新 master 和 tag（git push --follow-tags）会被 GitHub 按 ref 分别
#       派发，产生两个 run —— 这是 GitHub 的行为，工作流侧改不掉。两个 run 都构建同一个
#       commit 是纯浪费，所以分支 run 先确认「HEAD 已被 tag 覆盖」，是则整段跳过构建，
#       该 commit 的构建与发布交给 tag run（发布构建本身就包含编译校验）。
#       判定依据：分支与 tag 属于同一次 push 的 ref 事务，tag 在分支 run 判定时已落地；
#       仍保留少量重试以容忍 git 后端一致性延迟。
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
# 同一 ref 的旧 run 自动取消；分支与 tag 是不同 ref，互不影响
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # 回写版本号 commit / 创建 Release 需要写权限
    permissions:
      contents: write
    
    steps:
      # 1. 检出代码（fetch-depth: 0 让第 5.5 步能读到 origin/master 做版本号单调性校验）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      
      # 1.5. 判定本 run 是否要构建
      #      tag run  → 构建 + 发布
      #      分支 run → 仅当 HEAD 没被任何 tag 覆盖时做编译校验；
      #                 --follow-tags 一次推 master+tag 时本 run 整段跳过，交给 tag run。
      #      最多判定 3 次（间隔 10s），容忍远端 tag 的一致性延迟。
      - name: Decide whether this run builds
        id: guard
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🏷️ tag 推送（${GITHUB_REF_NAME}）：本 run 负责构建并发布。"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch --tags --force origin '+refs/tags/*:refs/tags/*' >/dev/null 2>&1 || true
            TAGGED=$(git tag --points-at HEAD | tr '\n' ' ')
            if [ -n "$TAGGED" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "ℹ️ HEAD 已被 tag 覆盖（${TAGGED}），本次分支校验跳过；该 commit 的构建与发布由对应 tag run 负责。"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "…第 ${attempt} 次未发现覆盖 HEAD 的 tag，10s 后重试"
              sleep 10
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "🧪 分支推送：本 run 只做编译校验（不发布、不改版本号、不回写）。"
      
      # 2. 设置 JDK 17
      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 3. 安装 Gradle
      - name: Setup Gradle
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.13'
      
      # 4. 解码并配置签名密钥
      #    分支校验走 assembleDebug，本不需要签名；但 release signingConfig 在配置阶段就会
      #    求值，所以两个角色共用同一套准备步骤，避免 debug 构建因缺键而配置失败。
      - name: Decode keystore
        if: steps.guard.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_OF_MANA }}
        run: |
          # 检查 secret 是否存在
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 错误：GitHub Secret 'KEYSTORE_FILE' 未设置或为空"
            echo "💡 提示：请在仓库 Settings > Secrets and variables > Actions 中设置 KEYSTORE_FILE"
            exit 1
          fi
          # 清理 base64 字符串：去除所有空白字符和换行符
          CLEAN_BASE64=$(echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr -d '\n' | tr -d '\r')
          # 进一步清理：只保留有效的 base64 字符（A-Z, a-z, 0-9, +, /, =）
          CLEAN_BASE64=$(echo "$CLEAN_BASE64" | grep -o '[A-Za-z0-9+/=]*' | tr -d '\n')
          # 验证清理后的 base64 字符串不为空
          if [ -z "$CLEAN_BASE64" ]; then
            echo "❌ 错误：base64 字符串为空（清理后）"
            echo "💡 提示：请检查 KEYSTORE_FILE secret 的值是否正确"
            exit 1
          fi
          echo "📝 Base64 字符串长度: ${#CLEAN_BASE64}"
          # 验证 base64 字符串格式（长度应该是4的倍数，或包含填充符=）
          BASE64_LEN=${#CLEAN_BASE64}
          REMAINDER=$((BASE64_LEN % 4))
          if [ $REMAINDER -ne 0 ]; then
            echo "⚠️  警告：base64 字符串长度不是4的倍数，添加填充"
            # 添加必要的填充
            PADDING_NEEDED=$((4 - REMAINDER))
            CLEAN_BASE64="${CLEAN_BASE64}$(printf '=%.0s' $(seq 1 $PADDING_NEEDED))"
            echo "📝 添加了 $PADDING_NEEDED 个填充字符"
          fi
          # 将清理后的 base64 写入临时文件，然后解码
          echo "$CLEAN_BASE64" > /tmp/keystore_base64.txt
          # 解码并写入文件（使用 -d 参数，Ubuntu 标准）
          base64 -d /tmp/keystore_base64.txt > "${{ github.workspace }}/Sun.jks" 2>&1
          # 检查解码是否成功
          DECODE_EXIT_CODE=$?
          if [ $DECODE_EXIT_CODE -ne 0 ]; then
            echo "❌ 错误：base64 解码失败，退出码: $DECODE_EXIT_CODE"
            echo "💡 提示：请检查 base64 编码是否正确"
            echo "💡 提示：确保使用 'base64 -i Sun.jks' (macOS) 或 'base64 Sun.jks' (Linux) 生成编码"
            exit 1
          fi
          # 验证文件是否成功创建且不为空
          if [ ! -f "${{ github.workspace }}/Sun.jks" ]; then
            echo "❌ 错误：密钥文件未创建"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "${{ github.workspace }}/Sun.jks" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -eq 0 ]; then
            echo "❌ 错误：密钥文件为空"
            exit 1
          fi
          echo "✅ 密钥文件解码成功，文件大小: $FILE_SIZE 字节"
      
      # 5. 创建 gradle.properties 配置 AndroidX 和签名信息
      #    注意：仓库里的 gradle.properties 被 .gitignore 忽略，CI 上不存在，
      #    而 release signingConfig 对所有 buildType 都会求值，所以这些键必须声明。
      - name: Create gradle.properties
        if: steps.guard.outputs.skip != 'true'
        run: |
          # 启用 AndroidX 支持（safeargs 插件必需）
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          # 配置 Gradle JVM 内存（解决 OutOfMemoryError）
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          # 配置 DEX 相关设置
          echo "android.dx.maxWorkerCount=4" >> gradle.properties
          # 配置签名信息
          echo "keyAlias=${{ secrets.KEY_ALIAS_MANA }}" >> gradle.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD_MANA }}" >> gradle.properties
          echo "storeFile=${{ github.workspace }}/Sun.jks" >> gradle.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
      
      # 5.5. 版本号以 tag 为唯一来源（仅推送 tag 时执行；就地修改 app/build.gradle，不新增文件）
      #      tag vX.Y.Z -> versionName X.Y.Z，versionCode = major*10000 + minor*100 + patch
      #      例：v2.4.8 -> versionName "2.4.8" / versionCode 20408
      - name: Parse tag and bump version
        id: version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          # 触发器只放行 v*.*.*，这里再做一次严格校验（拒绝 v2.4.8-rc1 这类）
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ tag '$TAG' 不符合 vX.Y.Z 规范（例：v2.4.8）"
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          # minor/patch 达到三位就会和其他版本号撞车（2.4.100 与 20.41.0 的 versionCode 相同）
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "❌ minor/patch 必须 ≤ 99（否则 versionCode 公式会与其他版本冲突）：$VERSION_NAME"
            exit 1
          fi
          NEW_VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          CUR_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          CUR_VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$CUR_VERSION_CODE" ] || [ -z "$CUR_VERSION_NAME" ]; then
            echo "❌ 无法从 app/build.gradle 读取 versionCode/versionName"
            exit 1
          fi
          # 读出来的必须是纯数字，否则下面的数值比较会「报错但被 if 吞掉」→ 守卫静默失效
          case "$CUR_VERSION_CODE" in
            ''|*[!0-9]*) echo "❌ 解析出的 versionCode 不是数字：'$CUR_VERSION_CODE'"; exit 1 ;;
          esac
          # 单调性守卫 1/2：tag 推导值必须大于 checkout 出来的文件值
          HIGHEST=$CUR_VERSION_CODE
          # 单调性守卫 2/2：也要大于 master 最新值。
          # 原因：tag 可能打在旧提交上（那时文件里的号还是旧的），只比文件不足以拦住「重发更旧的版本」。
          MASTER_REF="origin/master"
          if ! git rev-parse --verify --quiet "$MASTER_REF" >/dev/null; then
            git fetch origin master >/dev/null 2>&1 || MASTER_REF=""
          fi
          if [ -n "$MASTER_REF" ]; then
            MASTER_CODE=$(git show "$MASTER_REF:app/build.gradle" 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' | head -1 || true)
            if [ -n "$MASTER_CODE" ] && [ "$MASTER_CODE" -gt "$HIGHEST" ]; then
              HIGHEST=$MASTER_CODE
            fi
            echo "📌 master 最新 versionCode: ${MASTER_CODE:-未知}，比较基准: ${HIGHEST}"
          else
            echo "⚠️ 读不到 origin/master，仅以当前文件值 ${HIGHEST} 为基准"
          fi
          if [ "$NEW_VERSION_CODE" -le "$HIGHEST" ]; then
            echo "❌ tag 推导的 versionCode ($NEW_VERSION_CODE) 不大于已知最大值 ($HIGHEST)：该版本已经发布过（或比已发布版本更旧）。"
            echo "💡 同一个/更旧的版本不能重发，请换一个更高的 tag（例：v2.4.9）。"
            exit 1
          fi
          sed -i -E "s/^[[:space:]]*versionCode[[:space:]]+[0-9]+/        versionCode ${NEW_VERSION_CODE}/" app/build.gradle
          sed -i -E "s/^[[:space:]]*versionName[[:space:]]+\"[^\"]+\"/        versionName \"${VERSION_NAME}\"/" app/build.gradle
          echo "versionCode: ${CUR_VERSION_CODE} -> ${NEW_VERSION_CODE}"
          echo "versionName: ${CUR_VERSION_NAME} -> ${VERSION_NAME}"
          grep -nE 'versionCode|versionName' app/build.gradle
          {
            echo "NEW_VERSION_CODE=${NEW_VERSION_CODE}"
            echo "NEW_VERSION_NAME=${VERSION_NAME}"
          } >> "$GITHUB_ENV"
          {
            echo "version_name=${VERSION_NAME}"
            echo "apk_name=Mana-${VERSION_NAME}"
          } >> "$GITHUB_OUTPUT"
      
      # 6. 构建：tag run = 发布构建（签名 release APK）；分支 run = 编译校验（debug，不发布）
      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "🧾 发布构建：${{ github.ref_name }}"
            gradle assembleRelease --stacktrace
          else
            echo "🧪 分支编译校验：assembleDebug（不发布、不改版本号、不回写）"
            gradle assembleDebug --stacktrace
          fi
      
      # 7. 上传构建产物（只有发布构建才有产物；分支校验不产出可用包）
      - name: Upload APK artifact
        if: steps.guard.outputs.skip != 'true' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 8. 创建 GitHub Release（仅在推送 tag 时；名称/版本号都来自 tag）
      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 8.5. 把 tag 推导出的版本号提交回 master（仅推送 tag 时；放在构建+发布之后）
      #      回写失败只告警、不让 run 失败：版本号由 tag 推导，回写不成功也不会导致重号。
      - name: Commit bumped version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          # 提交前先记住标签所指向的提交，用于校验回写是否为快进推送
          TAG_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只暂存 app/build.gradle：第 5 步往 gradle.properties 追加过内容，绝不能带进提交
          git add app/build.gradle
          if git diff --cached --quiet; then
            echo "ℹ️ app/build.gradle 无变化，无需提交"
            exit 0
          fi
          git commit -m "chore: bump version to ${NEW_VERSION_NAME} (versionCode ${NEW_VERSION_CODE}) [skip ci]"
          if ! git fetch origin master; then
            echo "::warning::无法 fetch origin/master，跳过回写（Release 已发布，版本号由 tag 推导，不影响下次打 tag）"
            exit 0
          fi
          MASTER_SHA=$(git rev-parse origin/master 2>/dev/null || git rev-parse FETCH_HEAD)
          if [ "$MASTER_SHA" != "$TAG_SHA" ]; then
            echo "::warning::tag 指向的提交不是 master 最新提交（tag=${TAG_SHA} master=${MASTER_SHA}），回写会变成非快进推送，已跳过。"
            {
              echo "### ⚠️ 版本号未回写 master"
              echo ""
              echo "- tag 指向：\`${TAG_SHA}\`"
              echo "- master 最新：\`${MASTER_SHA}\`"
              echo "- 影响：仅仓库文件未跟上。本次 Release 已正常发布，版本号由 tag \`${GITHUB_REF_NAME}\` 推导，下次打 tag 不受影响。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git push origin HEAD:master; then
            echo "✅ 已把 ${NEW_VERSION_NAME} (versionCode ${NEW_VERSION_CODE}) 提交回 master"
          else
            echo "::warning::回写 master 失败（可能已被其他提交更新）。Release 已发布，版本号由 tag 推导，不影响下次打 tag。"
          fi

      # 9. 显示构建信息
      - name: Build Summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "✅ 发布构建成功！"
            echo "🎉 GitHub Release 已创建：${{ steps.version.outputs.apk_name }}（tag ${{ github.ref_name }}）"
            ls -lh app/build/outputs/apk/release/
          else
            echo "✅ 分支编译校验通过（assembleDebug）。"
            echo "📝 提示：push 版本 tag（vX.Y.Z）才会改版本号、构建签名包并发布 Release。"
          fi
