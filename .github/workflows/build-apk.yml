name: Build Android APK

# 触发条件：master 分支的所有更新（推送、PR、标签等）
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  create:
    tags:
      - '*'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    # 回写自增后的版本号 commit 需要写权限
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 3. 安装 Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.13'
      
      # 4. 解码并配置签名密钥
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_OF_MANA }}
        run: |
          # 检查 secret 是否存在
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 错误：GitHub Secret 'KEYSTORE_FILE' 未设置或为空"
            echo "💡 提示：请在仓库 Settings > Secrets and variables > Actions 中设置 KEYSTORE_FILE"
            exit 1
          fi
          # 清理 base64 字符串：去除所有空白字符和换行符
          CLEAN_BASE64=$(echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr -d '\n' | tr -d '\r')
          # 进一步清理：只保留有效的 base64 字符（A-Z, a-z, 0-9, +, /, =）
          CLEAN_BASE64=$(echo "$CLEAN_BASE64" | grep -o '[A-Za-z0-9+/=]*' | tr -d '\n')
          # 验证清理后的 base64 字符串不为空
          if [ -z "$CLEAN_BASE64" ]; then
            echo "❌ 错误：base64 字符串为空（清理后）"
            echo "💡 提示：请检查 KEYSTORE_FILE secret 的值是否正确"
            exit 1
          fi
          echo "📝 Base64 字符串长度: ${#CLEAN_BASE64}"
          # 验证 base64 字符串格式（长度应该是4的倍数，或包含填充符=）
          BASE64_LEN=${#CLEAN_BASE64}
          REMAINDER=$((BASE64_LEN % 4))
          if [ $REMAINDER -ne 0 ]; then
            echo "⚠️  警告：base64 字符串长度不是4的倍数，添加填充"
            # 添加必要的填充
            PADDING_NEEDED=$((4 - REMAINDER))
            CLEAN_BASE64="${CLEAN_BASE64}$(printf '=%.0s' $(seq 1 $PADDING_NEEDED))"
            echo "📝 添加了 $PADDING_NEEDED 个填充字符"
          fi
          # 将清理后的 base64 写入临时文件，然后解码
          echo "$CLEAN_BASE64" > /tmp/keystore_base64.txt
          # 解码并写入文件（使用 -d 参数，Ubuntu 标准）
          base64 -d /tmp/keystore_base64.txt > "${{ github.workspace }}/Sun.jks" 2>&1
          # 检查解码是否成功
          DECODE_EXIT_CODE=$?
          if [ $DECODE_EXIT_CODE -ne 0 ]; then
            echo "❌ 错误：base64 解码失败，退出码: $DECODE_EXIT_CODE"
            echo "💡 提示：请检查 base64 编码是否正确"
            echo "💡 提示：确保使用 'base64 -i Sun.jks' (macOS) 或 'base64 Sun.jks' (Linux) 生成编码"
            exit 1
          fi
          # 验证文件是否成功创建且不为空
          if [ ! -f "${{ github.workspace }}/Sun.jks" ]; then
            echo "❌ 错误：密钥文件未创建"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "${{ github.workspace }}/Sun.jks" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -eq 0 ]; then
            echo "❌ 错误：密钥文件为空"
            exit 1
          fi
          echo "✅ 密钥文件解码成功，文件大小: $FILE_SIZE 字节"
      
      # 5. 创建 gradle.properties 配置 AndroidX 和签名信息
      - name: Create gradle.properties
        run: |
          # 启用 AndroidX 支持（safeargs 插件必需）
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          # 配置 Gradle JVM 内存（解决 OutOfMemoryError）
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          # 配置 DEX 相关设置
          echo "android.dx.maxWorkerCount=4" >> gradle.properties
          # 配置签名信息
          echo "keyAlias=${{ secrets.KEY_ALIAS_MANA }}" >> gradle.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD_MANA }}" >> gradle.properties
          echo "storeFile=${{ github.workspace }}/Sun.jks" >> gradle.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> gradle.properties
      
      # 5.5. 版本号自增（仅推送标签时执行；就地修改已有的 app/build.gradle，不新增任何文件）
      #      versionCode +1，versionName 末位 +1（例如 137/2.3.7 -> 138/2.3.8）
      - name: Bump version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "❌ 无法从 app/build.gradle 读取 versionCode/versionName"
            exit 1
          fi
          if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ versionName '$VERSION_NAME' 不是 x.y.z 格式，无法末位 +1，请手动处理"
            exit 1
          fi
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          NEW_VERSION_NAME=$(echo "$VERSION_NAME" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          sed -i -E "s/^[[:space:]]*versionCode[[:space:]]+[0-9]+/        versionCode ${NEW_VERSION_CODE}/" app/build.gradle
          sed -i -E "s/^[[:space:]]*versionName[[:space:]]+\"[^\"]+\"/        versionName \"${NEW_VERSION_NAME}\"/" app/build.gradle
          echo "versionCode: ${VERSION_CODE} -> ${NEW_VERSION_CODE}"
          echo "versionName: ${VERSION_NAME} -> ${NEW_VERSION_NAME}"
          grep -nE 'versionCode|versionName' app/build.gradle
          {
            echo "NEW_VERSION_CODE=${NEW_VERSION_CODE}"
            echo "NEW_VERSION_NAME=${NEW_VERSION_NAME}"
          } >> "$GITHUB_ENV"

      # 6. 构建 Release APK
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
      
      # 7. 获取版本信息
      - name: Get version info
        id: version
        run: |
          # 提取版本号（去除引号和空格）
          # head -1 必需：app/build.gradle 第 28 行也含 "versionName"（archivesBaseName），不加会拼成 2.3.7Mana-
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk '{print $2}' | tr -d '"' | tr -d ' ')
          # 验证版本号是否提取成功
          if [ -z "$VERSION_NAME" ]; then
            echo "❌ 错误：无法提取版本号"
            exit 1
          fi
          # 清理版本号（去除所有空白字符和换行符）
          VERSION_NAME=$(echo "$VERSION_NAME" | tr -d '[:space:]' | tr -d '\n' | tr -d '\r')
          # 验证版本号不为空
          if [ -z "$VERSION_NAME" ]; then
            echo "❌ 错误：版本号为空"
            exit 1
          fi
          # 生成完整的 APK 名称格式（Mana-版本号）
          APK_NAME="Mana-${VERSION_NAME}"
          # 清理 APK 名称（去除所有空白字符和换行符）
          APK_NAME=$(echo "$APK_NAME" | tr -d '[:space:]' | tr -d '\n' | tr -d '\r')
          # 验证 APK 名称格式
          if [ "$APK_NAME" = "Mana-" ]; then
            echo "❌ 错误：APK 名称格式无效：$APK_NAME"
            exit 1
          fi
          # 使用多行格式输出到 GITHUB_OUTPUT（避免特殊字符问题）
          {
            echo "version_name=${VERSION_NAME}"
            echo "apk_name=${APK_NAME}"
          } >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME"
          echo "APK Name: $APK_NAME"
          echo "✅ 版本信息已输出到 GITHUB_OUTPUT"
      # 7.5. 上传构建产物（APK）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 8. 创建 GitHub Release（仅在推送标签时）
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 8.5. 把自增后的版本号提交回 master（仅推送标签时；放在构建+发布之后，构建失败不烧版本号）
      - name: Commit bumped version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          # 提交前先记住标签所指向的提交，用于校验回写是否为快进推送
          TAG_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只暂存 app/build.gradle：第 5 步往 gradle.properties 追加过内容，绝不能带进提交
          git add app/build.gradle
          if git diff --cached --quiet; then
            echo "ℹ️ app/build.gradle 无变化，无需提交"
            exit 0
          fi
          git commit -m "chore: bump version to ${NEW_VERSION_NAME} (versionCode ${NEW_VERSION_CODE}) [skip ci]"
          git fetch origin master
          MASTER_SHA=$(git rev-parse origin/master 2>/dev/null || git rev-parse FETCH_HEAD)
          if [ "$MASTER_SHA" != "$TAG_SHA" ]; then
            echo "❌ 标签指向的提交不是 master 最新提交（tag=${TAG_SHA} master=${MASTER_SHA}），回写会变成非快进推送，已中止。"
            echo "💡 请把标签打在 master 最新提交上；本次 ${NEW_VERSION_NAME} (versionCode ${NEW_VERSION_CODE}) 未持久化，下次打标签前需手动 +1。"
            exit 1
          fi
          git push origin HEAD:master
          echo "✅ 已把 ${NEW_VERSION_NAME} (versionCode ${NEW_VERSION_CODE}) 提交回 master"

      # 9. 显示构建信息
      - name: Build Summary
        run: |
          echo "✅ APK 构建成功！"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🎉 GitHub Release 已创建并附加 APK"
          else
            echo "📝 提示：推送标签可自动创建 Release"
          fi
          ls -lh app/build/outputs/apk/release/

